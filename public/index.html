<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Sovereign BTC Stack</title><style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--down:#f85149;--wait:#58a6ff;--btc:#f7931a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6edf3;font:15px system-ui,sans-serif}

.sys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.g b{display:block;font-size:15px}.g span{font-size:11px;color:var(--mut)}
.link{display:flex;align-items:center;gap:6px;margin:0 0 0 22px;height:30px;font-size:11px;color:var(--mut)}
.link i{width:3px;height:100%;background:var(--ok);border-radius:2px}.link.down i{background:var(--down)}.link.warn i{background:var(--warn)}.link.empty i{background:var(--line)}
.link.down{color:var(--down)}
.slot{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:11px 12px}
.slot.ok{border-left-color:var(--ok)}.slot.warn{border-left-color:var(--warn)}.slot.down{border-left-color:var(--down);box-shadow:0 0 14px #f8514940}.slot.waiting{border-left-color:var(--wait)}.slot.unknown{border-left-color:var(--mut)}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.svc{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:4px}.svc .n{font-weight:600;font-size:16px;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}.ok .dot,.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.down{background:var(--down)}.dot.waiting{background:var(--wait)}
.r{font-size:13px;margin-top:2px}.r.ok{color:var(--ok)}.r.warn{color:var(--warn)}.r.down{color:var(--down)}.r.waiting{color:var(--wait)}.r.unknown{color:var(--mut)}
.bar{height:5px;background:#30363d;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btc)}
svg.sp{width:70px;height:20px;flex:none}

a.ui,button{flex:1;text-align:center;padding:9px;border-radius:8px;background:#21262d;color:#e6edf3;text-decoration:none;font-size:13px;border:1px solid var(--line);font-family:inherit}
a.ui{background:#f7931a22;border-color:#f7931a66;color:var(--btc)}
button.more{flex:none;padding:5px 10px;font-size:12px;color:var(--mut);background:none;margin-top:8px}
.alts{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}.alt{text-decoration:none}a.alt:hover span:first-child{color:var(--btc)}.alt{font-size:13px;color:var(--mut);padding:4px 0;display:flex;justify-content:space-between}
.empty .n{color:var(--mut);font-weight:400;font-size:14px}
#sheet{position:fixed;inset:0;background:#000a;display:none;z-index:9;align-items:flex-end}#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kv div{background:#0d1117;border-radius:8px;padding:8px}.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:16px}
svg.big{width:100%;height:50px}
#demo{display:none;gap:4px;flex-wrap:wrap;margin-top:8px}#demo button{flex:none;padding:4px 8px;font-size:11px}#demo button.on{border-color:var(--btc);color:var(--btc)}

#flow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:44px;padding:0 16px 0 16px;grid-template-areas:"node node node" "indexer lightning datum" "explorer ui mining"}

 #flow>.slot{padding:18px 20px;border-radius:16px}
 #flow .k{font-size:13px}#flow .svc .n{font-size:clamp(18px,1.5vw,32px)}#flow .r{font-size:clamp(14px,1vw,20px);margin-top:6px}#flow .k{font-size:clamp(12px,.8vw,16px)}
 #flow .dot{width:14px;height:14px}#flow svg.sp{height:24px;margin-top:10px}
 #flow a.ui{padding:12px;font-size:clamp(14px,.9vw,18px)}#flow button.more{font-size:13px;padding:7px}#flow .alt{font-size:14px}
 h1{font-size:24px}}

#flow svg.sp{width:100%;height:14px;margin-top:4px}
#flow a.ui{padding:7px 4px;font-size:12px}#flow button.more{width:100%;padding:4px;font-size:11px}
#flow .alt{flex-direction:column;font-size:12px}#flow .alt span+span{font-size:10px}
#flow .svc{flex-wrap:wrap;gap:6px}#flow .chev{display:none}
.sysbox{grid-area:sys;position:relative;z-index:1}.sysbox .sys{margin:6px 0 0}
.wl{font:10px system-ui;fill:#8b949e}
.gd{font-size:12px;color:#c9d1d9;opacity:.85;margin-top:4px;line-height:1.35}
#lk{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.li{display:flex;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid #21262d;line-height:1.35}.li b{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid;display:grid;place-items:center;font-size:11px}
.li span{font-weight:600}.li.down b,.li.down span{color:var(--down)}.li.warn b,.li.warn span{color:var(--warn)}.li.waiting b,.li.waiting span{color:var(--wait)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:11px;color:var(--mut)}.lg span{display:flex;align-items:center;gap:5px}
@media(min-width:900px){#flow .gd{font-size:clamp(12px,.8vw,16px)}#lk{font-size:15px}.li{font-size:15px}}
#price,#stats{display:none}
@media(min-width:1100px){header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand mid rt" "demo demo demo";align-items:center;column-gap:clamp(24px,2.5vw,48px);padding:18px clamp(20px,2.5vw,48px);min-height:128px}
 #brand{grid-area:brand}#rt{grid-area:rt;display:flex;align-items:center;gap:16px}
 #price{display:block;font-size:clamp(46px,2.9vw,56px);font-weight:700;line-height:1;color:var(--btc);font-variant-numeric:tabular-nums;text-align:right}
 #price small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:6px;letter-spacing:.5px}
 #price.na{font-size:22px;font-weight:500;color:var(--mut)}#price:empty{display:none}
 h1{font-size:clamp(32px,2.1vw,40px);line-height:1.05;white-space:nowrap}#meta{font-size:13px;margin-top:6px}
 #mid{grid-area:mid}#stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,.8vw,16px)}
 .st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;min-width:0;text-align:center}
 .st b{display:block;font-size:clamp(19px,1.3vw,26px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .st span{display:block;font-size:12px;color:var(--mut);letter-spacing:.3px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.st.warn{border-color:#d2992266}.st.warn b{color:var(--warn)}
 #sum{margin-top:0;padding-left:16px;border-left:1px solid var(--line);flex-direction:column;align-items:stretch;gap:6px}#sum .pill{font-size:13px;font-weight:600;padding:6px 14px;white-space:nowrap}
 #demo{grid-area:demo}
 main{padding:2vh 2.5vw}#flow{column-gap:4vw;row-gap:10vh;min-height:calc(100vh - 200px)}}
@media(min-width:1100px){header{min-height:0;padding:8px clamp(16px,2vw,40px);grid-template-areas:"brand mid rt" "demo demo demo"}
 #brand{display:flex;align-items:baseline;gap:12px;white-space:nowrap}#meta{margin:0;font-size:12px}
 h1{font-size:clamp(30px,2vw,36px)}
 .st{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 8px;border-radius:8px}
 .st b{font-size:clamp(17px,1.15vw,22px)}.st span{margin:0;font-size:11px;order:-1}
 #price{font-size:clamp(36px,2.4vw,46px);display:flex;align-items:baseline;gap:6px}#price small{margin:0;display:inline}#price.na{font-size:18px}
 #sum{flex-direction:row;padding-left:12px}#sum .pill{font-size:12px;padding:4px 10px}}
@media(min-width:1100px){#stats{display:flex;justify-content:space-evenly;gap:6px}.st{flex:0 1 auto;border:0;background:none;padding:4px 6px}.st b,.st span{overflow:visible;text-overflow:clip}.st b{font-size:clamp(16px,1.1vw,22px)}
 #meta{font-size:11px;white-space:normal;max-width:9em;line-height:1.2}}
</style></head><body>
<header><div id="brand"><h1>₿ Sovereign BTC Stack</h1><div id="meta">Connecting…</div></div><div id="mid"><div id="stats"></div></div><div id="rt"><div id="price"></div><div id="sum"></div></div><div id="demo"></div></header>
<main><div id="flow"></div><div id="lkw"></div></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<script>
const $=s=>document.querySelector(s), open={}, gb=x=>(x/1e9).toFixed(1), fmt=n=>n==null?'—':Number(n).toLocaleString();
let S=null, scen=new URLSearchParams(location.search).get('scenario')||'all-green', detail=null;
const uiUrl=p=>p?`${location.protocol}//${location.hostname}:${p}`:null;
function spark(h,cls='sp'){if(!h||!h.length)return '';const w=100,n=h.length,pts=h.map((v,i)=>`${(i/(Math.max(n-1,1)))*w},${18-v*16}`).join(' ');
 const bad=h.some(v=>v<1);return `<svg class="${cls}" viewBox="0 0 100 20" preserveAspectRatio="none"><polyline fill="none" stroke="${bad?'#d29922':'#3fb950'}" stroke-width="1.6" points="${pts}"/>${h.map((v,i)=>v<0.5?`<rect x="${(i/(Math.max(n-1,1)))*w-1}" y="0" width="2" height="20" fill="#f85149"/>`:'').join('')}</svg>`}
function metrics(o){const d=o.data||{},m=[];
 if(d.headers!=null){m.push(['Block height',fmt(d.height)],['Headers',fmt(d.headers)],['Sync',d.sync+'%'],['Peers',fmt(d.peers)],['Mempool',fmt(d.mempoolTx)+' tx · '+d.mempoolMB+' MB'],['Disk used',d.diskGB+' GB'],['Version',d.version||'—'],['Pruned',d.pruned?'yes':'no'])}
 else if(d.walletState!==undefined){m.push(['Wallet',{NON_EXISTING:'Not created',WAITING_TO_START:'Starting',LOCKED:'Locked',UNLOCKED:'Unlocked',RPC_ACTIVE:'Active',SERVER_ACTIVE:'Active'}[d.walletState]||d.walletState]);
  if(d.synced!==undefined)m.push(['Synced to chain',d.synced?'yes':'no'],['Block height',fmt(d.height)],['Channels',fmt(d.channels)+(d.pending?` (+${d.pending} pending)`:'')],['Peers',fmt(d.peers)]);}
 else if(d.height!==undefined){const nh=nodeH();m.push(['Tip height',fmt(d.height)],['Node',fmt(nh)],['Behind',nh!=null?fmt(Math.max(0,nh-d.height))+' blocks':'—']);if(d.api!==undefined)m.push(['API',d.api?'reachable':'down'])}
 else m.push(['Port',o.status==='down'?'closed':(o.status==='unknown'?'not probed':'open')]);
 if(d.note)m.push(['Note',d.note]);return m}
function nodeH(){const n=S&&S.slots.find(s=>s.id==='node');return n&&n.active[0]?n.active[0].data.height:null}
function slotHTML(sl){const a=sl.active[0], st=a?a.status:'empty';
 let h=`<div class="slot ${st} ${a?'':'empty'}" id="b-${sl.id}" style="grid-area:${sl.id}"><div class="k">${sl.label}</div>`;
 if(a){for(const o of sl.active){const d=o.data, sync=d.sync!=null&&d.sync<100;
  h+=`<div class="svc" onclick="showDetail('${o.id}')"><span class="dot ${o.status}"></span><span class="n">${o.label} ›</span></div>
  <div class="r ${o.status}" onclick="showDetail('${o.id}')">${o.status==='down'?'⚠ ':''}${o.reason}${d.headers!=null?' · '+fmt(d.height):''}${d.height!=null&&d.headers==null&&d.walletState===undefined?' · '+fmt(d.height):''}</div>
  ${o.guide?`<div class="gd">${o.guide}</div>`:''}
  ${sync?`<div class="bar"><i style="width:${d.sync}%"></i></div>`:''}${spark(o.history)}
  ${o.uiPort?`<div class="row2"><a class="ui" href="${uiUrl(o.uiPort)}" target="_blank" rel="noopener">Open UI ↗</a></div>`:''}`}}
 else h+=`<div class="svc"><span class="dot"></span><span class="n">Not installed</span></div>`;
 if(sl.others.length){h+=`<button class="more" onclick="tog('${sl.id}')">${open[sl.id]?'Hide':'See other'} options (${sl.others.length})</button>`;
  if(open[sl.id])h+=`<div class="alts">${sl.others.map(o=>`<a class="alt" href="${o.storeUrl}" target="_blank" rel="noopener"><span>○ ${o.label}</span><span>in Umbrel App Store ↗</span></a>`).join('')}</div>`}
 return h+'</div>'}
const COL={ok:'#3fb950',warn:'#d29922',down:'#f85149',waiting:'#58a6ff',empty:'#484f58',unknown:'#6e7681'};
const DASH={down:'3 7',empty:'5 5',unknown:'5 5'}, LNAME=id=>{const s=S.slots.find(x=>x.id===id);return s&&s.active[0]?s.active[0].label:s?s.label:id};
let FLAG=[];
function linksHTML(){FLAG=S.links.filter(l=>['down','warn','waiting'].includes(l.status));
 const T={down:'Broken',warn:'Behind / syncing',waiting:'Waiting'};
 return `<section id="lk"><div class="k">Connections${FLAG.length?'':' · all verified links OK'}</div>${FLAG.map((l,i)=>`<div class="li ${l.status}"><b>${i+1}</b><div><span>${LNAME(l.from)} → ${LNAME(l.to)} · ${T[l.status]}</span><br>${l.guide}</div></div>`).join('')}
 <div class="lg">${[['ok','solid','Working, verified'],['warn','solid','Syncing or behind'],['down','broken','Can\'t communicate'],['waiting','solid','Waiting on you'],['unknown','dashed','Unknown / not installed']].map(([k,t,x])=>`<span><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${COL[k]}" stroke-width="3" ${t!=='solid'?`stroke-dasharray="${t==='broken'?'3 4':'5 4'}"`:''}/></svg>${x}</span>`).join('')}</div></section>`}
function wires(){const f=$('#flow');if(!f||!S)return;const fr=f.getBoundingClientRect();let svg=`<svg id="wires">${Object.entries(COL).map(([k,c])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`).join('')}`;
 for(const l of S.links){const A=$('#b-'+l.from),B=$('#b-'+l.to);if(!A||!B)continue;const a=A.getBoundingClientRect(),b=B.getBoundingClientRect();
  const st=COL[l.status]?l.status:'unknown', c=COL[st]; let d,lx,ly;
  const ax=a.left-fr.left,ay=a.top-fr.top,bx=b.left-fr.left,by=b.top-fr.top;
  if(l.from==='node'&&l.to==='explorer'){ // skips a row: route down the left gutter
   const y1=ay+a.height/2,x1=ax,y2=by+20,g=5;d=`M${x1},${y1} L${g},${y1} L${g},${y2} L${bx-2},${y2}`;lx=g;ly=(y1+y2)/2;}
  else if(l.from==='node'&&l.to==='mining'&&$('#b-datum')){ // skips DATUM's row: route down the right gutter
   const W=fr.width,y1=ay+a.height/2,x1=ax+a.width,y2=by+20,g=W-6;d=`M${x1},${y1} L${g},${y1} L${g},${y2} L${bx+b.width+2},${y2}`;lx=g;ly=(y1+y2)/2;}
  else if(a.bottom<=b.top){ // next row: bottom -> top
   const x1=Math.min(Math.max(bx+b.width/2,ax+12),ax+a.width-12),y1=ay+a.height,x2=bx+b.width/2,y2=by-2,m=(y1+y2)/2;
   d=`M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`;lx=(x1+x2)/2;ly=m;}
  else { const y=Math.max(ay,by)+18,r=bx>ax,x1=r?ax+a.width:ax,x2=r?bx-2:bx+b.width+2;d=`M${x1},${y} L${x2},${y}`;lx=(x1+x2)/2;ly=y;}
  svg+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${st==='down'?3:2.5}" ${DASH[st]?`stroke-dasharray="${DASH[st]}"`:''} marker-end="url(#m-${st})"/>`;
  const n=FLAG.indexOf(l)+1;
  if(st==='down')svg+=`<g><line x1="${lx-8}" y1="${ly-8}" x2="${lx+8}" y2="${ly+8}" stroke="${c}" stroke-width="3"/><line x1="${lx+8}" y1="${ly-8}" x2="${lx-8}" y2="${ly+8}" stroke="${c}" stroke-width="3"/><circle cx="${lx+14}" cy="${ly-10}" r="8" fill="#0d1117" stroke="${c}"/><text x="${lx+14}" y="${ly-6}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}">${n}</text></g>`;
  else if(n)svg+=`<g><circle cx="${lx}" cy="${ly}" r="9" fill="#0d1117" stroke="${c}" stroke-width="1.5"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" font-weight="700" fill="${c}">${n}</text></g>`;
 }
 const old=$('#wires');if(old)old.remove();f.insertAdjacentHTML('afterbegin',svg+'</svg>')}
function sysHTML(sy){if(!sy)return '';const memL=sy.memAvail<1e9,sw=sy.swapTotal?sy.swapUsed/sy.swapTotal:0,dk=sy.disk?1-sy.disk.free/sy.disk.total:null;
 return `<div class="slot sysbox ${memL||sw>.5||dk>.9?'down':'ok'}" onclick="showSys()"><div class="k">System · Node Master ›</div><div class="sys">${[[gb(sy.memAvail)+' GB','RAM free',memL],[gb(sy.swapUsed)+' GB','Swap used',sw>.5],[dk==null?'—':Math.round(dk*100)+'%','Disk used',dk>.9],[sy.tempC==null?'—':Math.round(sy.tempC)+'°C','CPU temp',sy.tempC>75]]
   .map(([v,l,bad])=>`<div class="g"><b style="color:${bad?'#f85149':'#e6edf3'}">${v}</b><span>${l}</span></div>`).join('')}</div></div>`}
function priceHTML(p){if(!p||p.enabled===false)return '';if(p.usd==null)return ['na','Price unavailable'];
 const age=(Date.now()-new Date(p.at))/60e3;return ['',`$${Math.round(p.usd).toLocaleString('en-US')}<small>BTC / USD${age>3?' · as of '+Math.round(age)+' min ago':''}</small>`]}
function statsHTML(){const ch=S.chain||{},nd=(S.slots.find(s=>s.id==='node')||{active:[]}).active[0],ix=(S.slots.find(s=>s.id==='indexer')||{active:[]}).active[0];
 const nh=nd&&nd.data.height!=null?nd.data.height:ch.mempoolTip,sy=nd&&nd.data.sync,f=ch.fees;
 return [['Tip',ch.referenceTip!=null?fmt(ch.referenceTip):'—'],['Node',nh!=null?fmt(nh):'—',sy!=null&&sy<100],['Sync',sy!=null?(sy>=100?'100%':'≈'+sy+'%'):'—',sy!=null&&sy<100],
  ['Index',ix&&ix.data.height!=null?fmt(ix.data.height):'—'],['Mempool',ch.mempoolTx!=null?fmt(ch.mempoolTx):'—'],['Fees',f?f.fast+'/'+f.hour+' sat/vB':'—']]
  .map(([l,v,w])=>`<div class="st${w?' warn':''}"><b>${v}</b><span>${l}</span></div>`).join('')}
function render(){if(!S)return;const all=S.slots.flatMap(s=>s.active),c=k=>all.filter(o=>o.status===k).length;
 $('#meta').textContent=`Node Master · updated ${new Date(S.updated).toLocaleTimeString()}${S.demo?' · DEMO':''}`;
 {const ph=priceHTML(S.price);$('#price').className=ph?ph[0]:'';$('#price').innerHTML=ph?ph[1]:'';$('#stats').innerHTML=statsHTML()}
 $('#sum').innerHTML=[['ok','OK','#3fb950'],['warn','Syncing','#d29922'],['waiting','Waiting','#58a6ff'],['down','Problems','#f85149']].filter(([k])=>c(k)).map(([k,t,col])=>`<span class="pill" style="color:${col}">● ${c(k)} ${t}</span>`).join('');
 $('#lkw').innerHTML=linksHTML();$('#flow').innerHTML=S.slots.map(slotHTML).join(''); requestAnimationFrame(wires);
 if(detail)showDetail(detail,true);
 if(S.demo&&new URLSearchParams(location.search).get('demo')==='1'){$('#demo').style.display='flex';$('#demo').innerHTML=S.scenarios.map(x=>`<button class="${x===scen?'on':''}" onclick="scen='${x}';load()">${x}</button>`).join('')}}
addEventListener('resize',()=>requestAnimationFrame(wires));
function tog(id){open[id]=!open[id];render()}
function showDetail(id,keep){const o=S.slots.flatMap(s=>s.active).find(o=>o.id===id);if(!o)return closeSheet();detail=id;
 $('#sheetIn').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="k">${S.slots.find(s=>s.active.includes(o)).label}</div><div style="font-size:20px;font-weight:600"><span class="dot ${o.status}" style="display:inline-block"></span> ${o.label}</div></div><button style="flex:none" onclick="closeSheet()">✕</button></div>
 <div class="r ${o.status}" style="margin-top:6px">${o.reason}</div><div class="gd">${o.guide||''}</div>${o.data.sync!=null&&o.data.sync<100?`<div class="bar"><i style="width:${o.data.sync}%"></i></div>`:''}
 <div class="kv">${metrics(o).map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
 <div class="k">Up/down · last 24h</div>${spark(o.history,'big')||'<div class="r unknown">No history yet</div>'}
 ${o.uiPort?`<div class="row2"><a class="ui" href="${uiUrl(o.uiPort)}" target="_blank" rel="noopener">Open ${o.label} ↗</a></div>`:''}`;$('#sheet').classList.add('on')}
function showSys(){const s=S.system;detail=null;$('#sheetIn').innerHTML=`<div style="display:flex;justify-content:space-between"><div style="font-size:20px;font-weight:600">System</div><button style="flex:none" onclick="closeSheet()">✕</button></div>
 <div class="kv">${[['RAM available',gb(s.memAvail)+' / '+gb(s.memTotal)+' GB'],['Swap used',gb(s.swapUsed)+' / '+gb(s.swapTotal)+' GB'],['Disk '+(s.disk?s.disk.path:''),s.disk?gb(s.disk.total-s.disk.free)+' / '+gb(s.disk.total)+' GB':'—'],['Disk free',s.disk?gb(s.disk.free)+' GB':'—'],['CPU temp',s.tempC==null?'—':s.tempC+' °C'],['Load (1/5/15m)',s.load.join(' / ')],['CPUs',s.cpus],['Uptime',Math.floor(s.uptime/86400)+'d '+Math.floor(s.uptime%86400/3600)+'h']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;$('#sheet').classList.add('on')}
function closeSheet(){detail=null;$('#sheet').classList.remove('on')}
async function load(){try{S=await (await fetch('api/status?scenario='+scen+(new URLSearchParams(location.search).get('price')?'&price='+new URLSearchParams(location.search).get('price'):''),{cache:'no-store'})).json();render()}catch{$('#meta').textContent='⚠ Cannot reach Sovereign BTC Stack server'}}
new ResizeObserver(()=>requestAnimationFrame(wires)).observe(document.body);load();setInterval(load,15000);
</script></body></html>
