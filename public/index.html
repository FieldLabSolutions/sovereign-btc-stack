<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117"><title>Sovereign BTC Stack</title><style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--mut:#8b949e;--ok:#3fb950;--warn:#d29922;--down:#f85149;--wait:#58a6ff;--btc:#f7931a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6edf3;font:15px system-ui,sans-serif}
header{padding:14px 16px 10px;position:sticky;top:0;background:#0d1117ee;backdrop-filter:blur(6px);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0;color:var(--btc)}#meta{font-size:12px;color:var(--mut);margin-top:3px}
#sum{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:#21262d}
main{max-width:560px;margin:0 auto;padding:10px 12px 40px}
.sys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}
.g b{display:block;font-size:15px}.g span{font-size:11px;color:var(--mut)}
.link{display:flex;align-items:center;gap:6px;margin:0 0 0 22px;height:30px;font-size:11px;color:var(--mut)}
.link i{width:3px;height:100%;background:var(--ok);border-radius:2px}.link.down i{background:var(--down)}.link.warn i{background:var(--warn)}.link.empty i{background:var(--line)}
.link.down{color:var(--down)}
.slot{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:11px 12px}
.slot.ok{border-left-color:var(--ok)}.slot.warn{border-left-color:var(--warn)}.slot.down{border-left-color:var(--down);box-shadow:0 0 14px #f8514940}.slot.waiting{border-left-color:var(--wait)}.slot.unknown{border-left-color:var(--mut)}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.svc{display:flex;align-items:center;gap:10px;cursor:pointer;margin-top:4px}.svc .n{font-weight:600;font-size:16px;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}.ok .dot,.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.down{background:var(--down)}.dot.waiting{background:var(--wait)}
.r{font-size:13px;margin-top:2px}.r.ok{color:var(--ok)}.r.warn{color:var(--warn)}.r.down{color:var(--down)}.r.waiting{color:var(--wait)}.r.unknown{color:var(--mut)}
.bar{height:5px;background:#30363d;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--btc)}
svg.sp{width:70px;height:20px;flex:none}
.row2{display:flex;gap:8px;margin-top:8px}
a.ui,button{flex:1;text-align:center;padding:9px;border-radius:8px;background:#21262d;color:#e6edf3;text-decoration:none;font-size:13px;border:1px solid var(--line);font-family:inherit}
a.ui{background:#f7931a22;border-color:#f7931a66;color:var(--btc)}
button.more{flex:none;padding:5px 10px;font-size:12px;color:var(--mut);background:none;margin-top:8px}
.alts{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}.alt{font-size:13px;color:var(--mut);padding:4px 0;display:flex;justify-content:space-between}
.empty .n{color:var(--mut);font-weight:400;font-size:14px}
#sheet{position:fixed;inset:0;background:#000a;display:none;z-index:9;align-items:flex-end}#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kv div{background:#0d1117;border-radius:8px;padding:8px}.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:16px}
svg.big{width:100%;height:50px}
#demo{display:none;gap:4px;flex-wrap:wrap;margin-top:8px}#demo button{flex:none;padding:4px 8px;font-size:11px}#demo button.on{border-color:var(--btc);color:var(--btc)}

#flow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;row-gap:44px;padding:0 0 0 16px;grid-template-areas:"node node node" "indexer lightning mining" "explorer ui ." "sys sys sys"}
@media(min-width:520px){#flow{grid-template-areas:". node ." "indexer lightning mining" "explorer ui ." "sys sys sys"}}
#flow svg#wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
#flow>.slot{position:relative;z-index:1;padding:8px;min-width:0}
#flow .svc .n{font-size:14px;overflow-wrap:anywhere}#flow .r{font-size:12px}
#flow svg.sp{width:100%;height:14px;margin-top:4px}
#flow a.ui{padding:7px 4px;font-size:12px}#flow button.more{width:100%;padding:4px;font-size:11px}
#flow .alt{flex-direction:column;font-size:12px}#flow .alt span+span{font-size:10px}
#flow .svc{flex-wrap:wrap;gap:6px}#flow .chev{display:none}
.sysbox{grid-area:sys;position:relative;z-index:1}.sysbox .sys{margin:6px 0 0}
.wl{font:10px system-ui;fill:#8b949e}
</style></head><body>
<header><h1>₿ Sovereign BTC Stack</h1><div id="meta">Connecting…</div><div id="sum"></div><div id="demo"></div></header>
<main><div id="flow"></div></main>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in" id="sheetIn"></div></div>
<script>
const $=s=>document.querySelector(s), open={}, gb=x=>(x/1e9).toFixed(1), fmt=n=>n==null?'—':Number(n).toLocaleString();
let S=null, scen=new URLSearchParams(location.search).get('scenario')||'all-green', detail=null;
const uiUrl=p=>p?`${location.protocol}//${location.hostname}:${p}`:null;
function spark(h,cls='sp'){if(!h||!h.length)return '';const w=100,n=h.length,pts=h.map((v,i)=>`${(i/(Math.max(n-1,1)))*w},${18-v*16}`).join(' ');
 const bad=h.some(v=>v<1);return `<svg class="${cls}" viewBox="0 0 100 20" preserveAspectRatio="none"><polyline fill="none" stroke="${bad?'#d29922':'#3fb950'}" stroke-width="1.6" points="${pts}"/>${h.map((v,i)=>v<0.5?`<rect x="${(i/(Math.max(n-1,1)))*w-1}" y="0" width="2" height="20" fill="#f85149"/>`:'').join('')}</svg>`}
function metrics(o){const d=o.data||{},m=[];
 if(d.headers!=null){m.push(['Block height',fmt(d.height)],['Headers',fmt(d.headers)],['Sync',d.sync+'%'],['Peers',fmt(d.peers)],['Mempool',fmt(d.mempoolTx)+' tx · '+d.mempoolMB+' MB'],['Disk used',d.diskGB+' GB'],['Version',d.version||'—'],['Pruned',d.pruned?'yes':'no'])}
 else if(d.walletState!==undefined){m.push(['Wallet',{NON_EXISTING:'Not created',WAITING_TO_START:'Starting',LOCKED:'Locked',UNLOCKED:'Unlocked',RPC_ACTIVE:'Active',SERVER_ACTIVE:'Active'}[d.walletState]||d.walletState]);
  if(d.synced!==undefined)m.push(['Synced to chain',d.synced?'yes':'no'],['Block height',fmt(d.height)],['Channels',fmt(d.channels)+(d.pending?` (+${d.pending} pending)`:'')],['Peers',fmt(d.peers)]);}
 else if(d.height!==undefined){const nh=nodeH();m.push(['Tip height',fmt(d.height)],['Node height',fmt(nh)],['Behind',nh!=null?fmt(Math.max(0,nh-d.height))+' blocks':'—']);if(d.api!==undefined)m.push(['API',d.api?'reachable':'down'])}
 else m.push(['Port',o.status==='down'?'closed':(o.status==='unknown'?'not probed':'open')]);
 if(d.note)m.push(['Note',d.note]);return m}
function nodeH(){const n=S&&S.slots.find(s=>s.id==='node');return n&&n.active[0]?n.active[0].data.height:null}
function slotHTML(sl){const a=sl.active[0], st=a?a.status:'empty';
 let h=`<div class="slot ${st} ${a?'':'empty'}" id="b-${sl.id}" style="grid-area:${sl.id}"><div class="k">${sl.label}</div>`;
 if(a){for(const o of sl.active){const d=o.data, sync=d.sync!=null&&d.sync<100;
  h+=`<div class="svc" onclick="showDetail('${o.id}')"><span class="dot ${o.status}"></span><span class="n">${o.label} ›</span></div>
  <div class="r ${o.status}" onclick="showDetail('${o.id}')">${o.status==='down'?'⚠ ':''}${o.reason}${d.headers!=null?' · '+fmt(d.height):''}${d.height!=null&&d.headers==null&&d.walletState===undefined?' · '+fmt(d.height):''}</div>
  ${sync?`<div class="bar"><i style="width:${d.sync}%"></i></div>`:''}${spark(o.history)}
  ${o.uiPort?`<div class="row2"><a class="ui" href="${uiUrl(o.uiPort)}" target="_blank" rel="noopener">Open UI ↗</a></div>`:''}`}}
 else h+=`<div class="svc"><span class="dot"></span><span class="n">Not installed</span></div>`;
 if(sl.others.length){h+=`<button class="more" onclick="tog('${sl.id}')">${open[sl.id]?'Hide':'See other'} options (${sl.others.length})</button>`;
  if(open[sl.id])h+=`<div class="alts">${sl.others.map(o=>`<div class="alt"><span>○ ${o.label}</span><span>in Umbrel App Store</span></div>`).join('')}</div>`}
 return h+'</div>'}
const COL={ok:'#3fb950',warn:'#d29922',down:'#f85149',waiting:'#58a6ff',empty:'#484f58'};
function wires(){const f=$('#flow');if(!f||!S)return;const fr=f.getBoundingClientRect();let svg=`<svg id="wires">${Object.entries(COL).map(([k,c])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>`).join('')}`;
 for(const l of S.links){const A=$('#b-'+l.from),B=$('#b-'+l.to);if(!A||!B)continue;const a=A.getBoundingClientRect(),b=B.getBoundingClientRect();
  const st=l.status==='empty'?'empty':l.status, c=COL[st]||COL.ok; let d,lx,ly;
  const ax=a.left-fr.left,ay=a.top-fr.top,bx=b.left-fr.left,by=b.top-fr.top;
  if(a.bottom<=b.top+2&&!(b.top-a.bottom>60)){ // adjacent rows: bottom -> top
   const x1=Math.min(Math.max(bx+b.width/2,ax+12),ax+a.width-12),y1=ay+a.height,x2=bx+b.width/2,y2=by-2,m=(y1+y2)/2;
   d=`M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}`;lx=(x1+x2)/2;ly=m;}
  else if(a.bottom<=b.top){ // skip rows: route down the left gutter
   const y1=ay+a.height/2,x1=ax,y2=by+20,g=5;d=`M${x1},${y1} L${g},${y1} L${g},${y2} L${bx-2},${y2}`;lx=g;ly=(y1+y2)/2;}
  else { // same row: side -> side
   const y=Math.max(ay,by)+18,x1=ax+a.width,x2=bx-2;d=`M${Math.min(x1,bx+b.width)},${y} L${x2>x1?x2:bx+b.width},${y}`;lx=(x1+x2)/2;ly=y;}
  svg+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" ${st==='empty'?'stroke-dasharray="5 5"':''} marker-end="url(#m-${st})"/>`;
  if(st==='down')svg+=`<g><circle cx="${lx}" cy="${ly}" r="9" fill="#0d1117" stroke="${c}"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" fill="${c}">⚠</text></g>`;
 }
 const old=$('#wires');if(old)old.remove();f.insertAdjacentHTML('afterbegin',svg+'</svg>')}
function sysHTML(sy){if(!sy)return '';const memL=sy.memAvail<1e9,sw=sy.swapTotal?sy.swapUsed/sy.swapTotal:0,dk=sy.disk?1-sy.disk.free/sy.disk.total:null;
 return `<div class="slot sysbox ${memL||sw>.5||dk>.9?'down':'ok'}" onclick="showSys()"><div class="k">System · Node Master ›</div><div class="sys">${[[gb(sy.memAvail)+' GB','RAM free',memL],[gb(sy.swapUsed)+' GB','Swap used',sw>.5],[dk==null?'—':Math.round(dk*100)+'%','Disk used',dk>.9],[sy.tempC==null?'—':Math.round(sy.tempC)+'°C','CPU temp',sy.tempC>75]]
   .map(([v,l,bad])=>`<div class="g"><b style="color:${bad?'#f85149':'#e6edf3'}">${v}</b><span>${l}</span></div>`).join('')}</div></div>`}
function render(){if(!S)return;const all=S.slots.flatMap(s=>s.active),c=k=>all.filter(o=>o.status===k).length;
 $('#meta').textContent=`Node Master · updated ${new Date(S.updated).toLocaleTimeString()}${S.demo?' · DEMO':''}`;
 $('#sum').innerHTML=[['ok','OK','#3fb950'],['warn','Lagging','#d29922'],['waiting','Waiting','#58a6ff'],['down','Down','#f85149']].filter(([k])=>c(k)).map(([k,t,col])=>`<span class="pill" style="color:${col}">● ${c(k)} ${t}</span>`).join('');
 $('#flow').innerHTML=S.slots.map(slotHTML).join('')+sysHTML(S.system);requestAnimationFrame(wires);
 if(detail)showDetail(detail,true);
 if(S.demo){$('#demo').style.display='flex';$('#demo').innerHTML=S.scenarios.map(x=>`<button class="${x===scen?'on':''}" onclick="scen='${x}';load()">${x}</button>`).join('')}}
addEventListener('resize',()=>requestAnimationFrame(wires));
function tog(id){open[id]=!open[id];render()}
function showDetail(id,keep){const o=S.slots.flatMap(s=>s.active).find(o=>o.id===id);if(!o)return closeSheet();detail=id;
 $('#sheetIn').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div><div class="k">${S.slots.find(s=>s.active.includes(o)).label}</div><div style="font-size:20px;font-weight:600"><span class="dot ${o.status}" style="display:inline-block"></span> ${o.label}</div></div><button style="flex:none" onclick="closeSheet()">✕</button></div>
 <div class="r ${o.status}" style="margin-top:6px">${o.reason}</div>${o.data.sync!=null&&o.data.sync<100?`<div class="bar"><i style="width:${o.data.sync}%"></i></div>`:''}
 <div class="kv">${metrics(o).map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
 <div class="k">Up/down · last 24h</div>${spark(o.history,'big')||'<div class="r unknown">No history yet</div>'}
 ${o.uiPort?`<div class="row2"><a class="ui" href="${uiUrl(o.uiPort)}" target="_blank" rel="noopener">Open ${o.label} ↗</a></div>`:''}`;$('#sheet').classList.add('on')}
function showSys(){const s=S.system;detail=null;$('#sheetIn').innerHTML=`<div style="display:flex;justify-content:space-between"><div style="font-size:20px;font-weight:600">System</div><button style="flex:none" onclick="closeSheet()">✕</button></div>
 <div class="kv">${[['RAM available',gb(s.memAvail)+' / '+gb(s.memTotal)+' GB'],['Swap used',gb(s.swapUsed)+' / '+gb(s.swapTotal)+' GB'],['Disk '+(s.disk?s.disk.path:''),s.disk?gb(s.disk.total-s.disk.free)+' / '+gb(s.disk.total)+' GB':'—'],['Disk free',s.disk?gb(s.disk.free)+' GB':'—'],['CPU temp',s.tempC==null?'—':s.tempC+' °C'],['Load (1/5/15m)',s.load.join(' / ')],['CPUs',s.cpus],['Uptime',Math.floor(s.uptime/86400)+'d '+Math.floor(s.uptime%86400/3600)+'h']].map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;$('#sheet').classList.add('on')}
function closeSheet(){detail=null;$('#sheet').classList.remove('on')}
async function load(){try{S=await (await fetch('api/status?scenario='+scen,{cache:'no-store'})).json();render()}catch{$('#meta').textContent='⚠ Cannot reach Sovereign BTC Stack server'}}
new ResizeObserver(()=>requestAnimationFrame(wires)).observe(document.body);load();setInterval(load,15000);
</script></body></html>
